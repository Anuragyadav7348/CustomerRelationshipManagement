<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRM - Customer Management</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        /* HEADER */

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        /* MAIN CONTAINER */

        .container {
            padding: 30px;
        }

        /* CARDS */

        .card-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 200px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin: 0;
            font-size: 30px;
        }

        .card p {
            color: #666;
        }

        /* CUSTOMER SECTION */

        .customer-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        /* FORM */

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* BUTTON */

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            width: fit-content;
        }

        button:hover {
            background: #1d4ed8;
        }

        form button {
            width: 150px;
        }

        /* MESSAGE */

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        /* CUSTOMER LIST */

        #customerList {
            margin-top: 20px;
        }

        .customer {
            background: #f9fafb;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid #2563eb;
        }

        .customer p {
            margin: 5px 0;
        }

    </style>

</head>


<body>
<div style="position: fixed; top: 15px; right: 20px; z-index: 9999;">
    <form action="/logout" method="post">
        <button type="submit"
                style="padding: 12px 20px;
                       background-color: red;
                       color: white;
                       border: none;
                       border-radius: 8px;
                       cursor: pointer;
                       font-size: 16px;">
            Logout
        </button>
    </form>
</div>


<!-- HEADER -->

<header>

    <h1>Customer Relationship Management</h1>

    <p>CRM Dashboard</p>

</header>


<!-- MAIN -->

<div class="container">


    <!-- DASHBOARD CARDS -->

    <!-- DASHBOARD CARDS -->

    <div class="card-container">

        <!-- Total Customers -->

        <div class="card">

            <h2 id="totalCustomers">0</h2>

            <p>Total Customers</p>

        </div>

        <!-- Active Customers -->

        <div class="card">

            <h2 id="activeCustomers">0</h2>

            <p>Active Customers</p>

        </div>

    </div>



    <!-- ADD CUSTOMER FORM -->

    <div class="customer-section">

        <h2>Add New Customer</h2>

        <form id="customerForm">
            <input type="hidden" id="customerId">



            <input
                    type="text"
                    id="firstName"
                    placeholder="First Name"
                    required
            >


            <input
                    type="text"
                    id="lastName"
                    placeholder="Last Name"
                    required
            >


            <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
            >


            <input
                    type="text"
                    id="mobileNumber"
                    placeholder="Mobile Number"
                    required
            >


            <input
                    type="number"
                    id="age"
                    placeholder="Age"
                    min="18"
                    required
            >


            <button type="submit" id="submitButton">
                Add Customer
            </button>


        </form>


        <p id="message"></p>

    </div>



    <!-- CUSTOMER MANAGEMENT -->

    <div class="customer-section">

        <h2>Customer Management</h2>

        <p>
            Manage your customers using the CRM system.
        </p>
        <div style="margin: 20px 0;">

            <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by name, email or mobile"
                    onkeyup="searchCustomers()"
                    style="width: 300px;"
            >

        </div>



        <button onclick="loadCustomers()">

            Load Customers

        </button>


        <div id="customerList"></div>

    </div>


</div>

<script>
    function loadCustomers() {
        fetch("/customers")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to load customers");
                }
                return response.json();
            })
            .then(customers => {
                document.getElementById("totalCustomers").innerText =
                    customers.length;

                const activeCount = customers.filter(
                    customer => customer.active === true
                ).length;

                document.getElementById("activeCustomers").innerText =
                    activeCount;

                displayCustomers(customers);
            })
            .catch(error => {
                console.error("Error loading customers:", error);
                document.getElementById("customerList").innerHTML =
                    "<p>Customers load nahi ho paaye!</p>";
            });
    }

    document.getElementById("customerForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const customer = {
            firstName: document.getElementById("firstName").value.trim(),
            lastName: document.getElementById("lastName").value.trim(),
            email: document.getElementById("email").value.trim(),
            mobileNumber: document.getElementById("mobileNumber").value.trim(),
            age: Number(document.getElementById("age").value)
        };

        const customerId = document.getElementById("customerId").value;
        const url = customerId ? "/customers/" + customerId : "/customers";
        const method = customerId ? "PUT" : "POST";

        fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(customer)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error("Customer save nahi hua");
            }
            return response.json();
        })
        .then(data => {
            document.getElementById("message").innerText = customerId
                ? "Customer updated successfully!"
                : "Customer added successfully! ID: " + data.id;

            document.getElementById("customerForm").reset();
            document.getElementById("customerId").value = "";
            document.getElementById("submitButton").innerText = "Add Customer";

            loadCustomers();
        })
        .catch(error => {
            document.getElementById("message").innerText = "Error saving customer";
            console.error(error);
        });
    });

    function editCustomer(id) {
        fetch("/customers/" + id)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Customer not found");
                }
                return response.json();
            })
            .then(customer => {
                document.getElementById("customerId").value = id;
                document.getElementById("firstName").value = customer.firstName;
                document.getElementById("lastName").value = customer.lastName;
                document.getElementById("email").value = customer.email;
                document.getElementById("mobileNumber").value = customer.mobileNumber;
                document.getElementById("age").value = customer.age;

                document.getElementById("submitButton").innerText = "Update Customer";
                document.getElementById("message").innerText =
                    "Editing customer ID: " + id;

                document.getElementById("firstName").focus();
            })
            .catch(error => {
                console.error("Edit error:", error);
                document.getElementById("message").innerText =
                    "Could not load customer";
            });
    }

    function deleteCustomer(id) {
        if (!confirm("Are you sure you want to delete this customer?")) {
            return;
        }

        fetch("/customers/" + id, { method: "DELETE" })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Customer delete nahi hua");
                }
                return response.text();
            })
            .then(message => {
                document.getElementById("message").innerText = message;
                loadCustomers();
            })
            .catch(error => {
                document.getElementById("message").innerText =
                    "Error deleting customer";
                console.error(error);
            });
    }

    function searchCustomers() {
        const searchText = document.getElementById("searchInput")
            .value.toLowerCase().trim();

        fetch("/customers")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to fetch customers");
                }
                return response.json();
            })
            .then(customers => {
                const filteredCustomers = customers.filter(customer => {
                    const fullName =
                        (customer.firstName + " " + customer.lastName).toLowerCase();

                    const email = (customer.email || "").toLowerCase();
                    const mobile = (customer.mobileNumber || "").toLowerCase();

                    return fullName.includes(searchText) ||
                           email.includes(searchText) ||
                           mobile.includes(searchText);
                });

                displayCustomers(filteredCustomers);
            })
            .catch(error => {
                console.error("Search error:", error);
                document.getElementById("customerList").innerHTML =
                    "<p>Search failed. Please try again.</p>";
            });
    }

    function displayCustomers(customers) {
        let html = "<h3>Customers</h3>";

        if (customers.length === 0) {
            html += "<p>No customers found!</p>";
        }

        customers.forEach(customer => {
            html += `
                <div class="customer">
                    <p><strong>Name:</strong> ${customer.firstName} ${customer.lastName}</p>
                    <p><strong>Email:</strong> ${customer.email}</p>
                    <p><strong>Mobile:</strong> ${customer.mobileNumber}</p>
                    <p><strong>Age:</strong> ${customer.age}</p>
                    <p><strong>Status:</strong> ${customer.active ? "Active" : "Inactive"}</p>
                    <button onclick="editCustomer(${customer.id})">Edit</button>
                    <button onclick="deleteCustomer(${customer.id})">Delete</button>
                </div>
            `;
        });

        document.getElementById("customerList").innerHTML = html;
    }

    // Dashboard load hote hi customers dikhao
    document.addEventListener("DOMContentLoaded", loadCustomers);
</script>

</body>
</html>
